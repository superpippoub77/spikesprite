name: Diagnostica AI 3D (temporanea)
on:
  push:
    branches: [claude/nice-ritchie-q4y9mx]
    paths: ['.github/probe/**', '.github/workflows/probe-ai3d.yml', 'js/ai3d.js']
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prova completa nel browser con gli Space veri
        run: |
          cd .github/probe && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node -e "$(sed -n '/^function knightPng/,/^}/p' probe.mjs); require('fs').writeFileSync('knight.png', knightPng())" --input-type=commonjs 2>/dev/null || node --input-type=module -e "import zlib from 'node:zlib'; import fs from 'node:fs'; $(sed -n '/^function knightPng/,/^}/p' probe.mjs); fs.writeFileSync('knight.png', knightPng())"
          (cd ../.. && python3 -m http.server 8000 >/dev/null 2>&1 &) ; sleep 2
          IMG=$PWD/knight.png CHOICES="auto,trellis-community/TRELLIS" node e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: .github/probe/shot-*.png }

name: Diagnostica AI 3D (temporanea)
on:
  push:
    branches: [claude/nice-ritchie-q4y9mx]
    paths: ['.github/probe/**', '.github/workflows/probe-ai3d.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd .github/probe && npm init -y >/dev/null && npm i @gradio/client@2.7.2 >/dev/null && node probe.mjs
